name: pr

on:
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: prChecks
        run: pnpm prChecks

  compatibility:
    needs: core
    timeout-minutes: 20
    strategy:
      matrix:
        node: [lts/*]
        os: [windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            node: lts/-1
          - os: ubuntu-latest
            node: latest
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup
        with:
          node: ${{ matrix.node }}

      # To test node and OS versions, we don't care about rechecking types
      # so just check runtime behavior
      - name: Test
        run: pnpm testRepo

  typescript:
    needs: core
    timeout-minutes: 10
    strategy:
      matrix:
        # minimum supported version, then the latest of each major
        typescript: [5.1.6, 6.0.3, 7.0.2]
      fail-fast: false

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup repo
        uses: ./.github/actions/setup

      # unlike npx, dlx always runs the requested version even if the workspace has a copy
      - name: Typecheck consumer usage with TypeScript ${{ matrix.typescript }}
        run: pnpm --package=typescript@${{ matrix.typescript }} dlx -c "tsc --version && tsc --project ark/repo/tsCompat"

  attest-ts7:
    needs: core
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Install TypeScript 7
        run: |
          sed -i "s/^  typescript: .*/  typescript: 7.0.2/" pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile

      # attest's declarations must not depend on TS 5's compiler API types
      - name: Typecheck attest's declarations
        run: pnpm tsc --version && pnpm tsc --project ark/repo/tsCompat/tsconfig.attest.json

      # snap population tests compare exact instantiation counts, which are
      # measured differently with TS 7 (see ark/attest/ts7/instantiations.ts)
      - name: Test attest
        working-directory: ark/attest
        run: pnpm mocha --config ../repo/mocha.package.jsonc --fgrep "populates file" --invert

  prChecks:
    needs: [compatibility, typescript, attest-ts7]
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - run: echo All checks succeeded! ⛵
