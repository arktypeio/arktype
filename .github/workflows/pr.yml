name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup

      # twoslash results (see ark/docs/lib/content/twoslash.ts), keyed by what
      # every result depends on, matching publish.yml
      - name: Cache docs twoslash results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ark/docs/node_modules/.cache/ark-docs
          key: docs-twoslash-${{ hashFiles('ark/*/out/**/*.d.ts', 'ark/docs/lib/shiki.ts', 'ark/docs/package.json') }}

      - name: Lint
        run: pnpm lint

      - name: Build docs
        run: pnpm buildDocs

      - name: Test and benchmark
        run: pnpm testRepoWithBenches

      - name: Test jitless
        run: pnpm testJitless

  # fast TypeScript checks run in parallel with core; the full consumer and
  # older-TS matrix runs nightly and on demand via nightly.yml (label ci:ts)
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Test attest@tsgo and repo@6.0.3
        run: pnpm testTsVersions attest@tsgo repo@6.0.3

  # @ark/aot's tests, which take about 25 minutes in one process on a runner,
  # dealt among eight by ark/repo/testAotShard.ts. A change to the shard count
  # is made here and to defaultShardCount in ark/repo/aotShards.ts. They start
  # alongside core rather than after it, so the gate doesn't wait on both in
  # turn. nightly.yml runs @ark/aot's other suites nightly and on demand.
  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Test @ark/aot (shard ${{ matrix.shard }}/8)
        run: pnpm testAot
        env:
          ARK_SHARD: ${{ matrix.shard }}/8

  # posts or updates one sticky comment suggesting offloaded nightly suites
  # based on which folders the PR modifies; skipped on forks (read-only token)
  suggest:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout suggestion script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: ark/repo/suggestCiSuites.ts
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Suggest extra CI suites
        run: node ark/repo/suggestCiSuites.ts --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --post
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  prChecks:
    needs:
      - core
      - typescript
      - aot
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - run: echo All checks succeeded! ⛵
