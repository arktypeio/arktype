name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: prChecks
        run: pnpm prChecks

      - name: Test jitless
        run: pnpm testJitless

  compatibility:
    needs: core
    timeout-minutes: 20
    strategy:
      matrix:
        node: [lts/*]
        os: [windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            node: lts/-1
          - os: ubuntu-latest
            node: latest
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup
        with:
          node: ${{ matrix.node }}

      # To test node and OS versions, we don't care about rechecking types
      # so just check runtime behavior
      - name: Test
        run: pnpm testRepo

  history:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Test history independence
        run: pnpm testHistory --jobs 4

  differential:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # the build's options: mutatesInput with each errors mode, size builds,
        # and errors written for size apart from validators
        options:
          - "{}"
          - '{"mutatesInput": true, "errors": "first"}'
          - '{"mutatesInput": true, "errors": "none"}'
          - '{"mutatesInput": "always", "errors": "first"}'
          - '{"mutatesInput": "always", "errors": "none", "jsonInput": true}'
          - '{"optimize": "size"}'
          - '{"optimize": "size", "errors": "first"}'
          - '{"optimizeErrors": "size"}'
          - '{"optimize": "size", "optimizeErrors": "speed"}'
          - '{"optimizeErrors": "size", "errors": "none"}'
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Compare the suites' roots with their precompiled validators
        run: pnpm testDifferential
        env:
          ARK_PRECOMPILE_OPTIONS: ${{ matrix.options }}

  cache:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Run the suites on units precompiled for other roots
        run: pnpm testCache

  perturbation:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Change what precompiled sites read
        run: pnpm testPerturbation

      - name: Run generated programs through the build
        run: pnpm testPrograms
        env:
          ARK_PRECOMPILE_PROGRAMS: 300

  environments:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      # the runner's Chrome is used as installed
      - name: Setup Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1

      - name: Run a precompiled program across environments
        run: pnpm testEnvironments
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}

  tsVersionTasks:
    needs: core
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.list.outputs.tasks }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - id: list
        run: echo "tasks=$(node ark/repo/testTsVersions.ts --list)" >> "$GITHUB_OUTPUT"

  typescript:
    needs: tsVersionTasks
    timeout-minutes: 20
    strategy:
      matrix:
        task: ${{ fromJSON(needs.tsVersionTasks.outputs.tasks) }}
      fail-fast: false

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Test ${{ matrix.task }}
        run: pnpm testTsVersions ${{ matrix.task }}

  prChecks:
    needs:
      - compatibility
      - typescript
      - differential
      - perturbation
      - cache
      - environments
      - history
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - run: echo All checks succeeded! ⛵
