name: leaderboard

# Every Monday, reruns the independent suites that measure bundle size (the
# login form, schemabenchmarks.dev's download and Sury's bundle) with each
# rival at its newest release and ArkType at main, rewrites the leaderboard
# from them and checks the site's claims against it. A changed leaderboard is
# pushed to bench/leaderboard with an issue linking its pull request, and a
# claim the new standings don't back fails the run once that issue is open. The speed and startup suites count instructions
# with perf, which needs hardware counters hosted runners don't expose, so
# they're rerun by hand (ark/repo/bench/external/README.md, "Reproduce").

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: leaderboard

defaults:
  run:
    shell: bash

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # schemabenchmarks.dev runs on its own .node-version
      - name: Setup Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1

      - name: Locate Node 26
        run: echo "NODE26=$(command -v node)" >> "$GITHUB_ENV"

      - name: Setup repo
        uses: ./.github/actions/setup
        with:
          node: 24.14.1

      - name: Locate Node 24
        run: echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"

      - name: Claims before
        run: node ark/docs/lib/bench/headline.ts > "$RUNNER_TEMP/before.md" 2>&1 || true

      # ttsc's first Go build of typia's plugin can fail, so a failed run is
      # tried once more
      - name: Rerun the size suites
        run: pnpm benchExternal size --newest || pnpm benchExternal size --newest

      # results/newest/run.json's date and commit change every week, so only a
      # changed leaderboard is kept for a pull request
      - name: Keep only a changed leaderboard
        run: |
          if git diff --quiet ark/docs/lib/bench/leaderboard.json; then
            git checkout -- ark/repo/bench/external/results
            git clean -fdq ark/repo/bench/external/results
          fi

      - name: Check the claims
        id: claims
        continue-on-error: true
        run: node ark/docs/lib/bench/headline.ts > "$RUNNER_TEMP/after.md" 2>&1

      - name: Write the issue's body
        env:
          CLAIMS: ${{ steps.claims.outcome }}
        run: |
          {
            echo "The weekly rerun of the size suites, each rival at its newest release and ArkType at ${GITHUB_SHA::9}. \`results/newest/run.json\` lists the installs."
            echo
            if [ "$CLAIMS" = failure ]; then
              echo "**A claim on the site isn't backed by these standings. Change the copy in \`ark/docs/lib/claims.ts\` before merging.**"
              echo
            fi
            echo "### Claims after"
            echo
            cat "$RUNNER_TEMP/after.md"
            echo
            echo "### Claims before"
            echo
            cat "$RUNNER_TEMP/before.md"
          } > "$RUNNER_TEMP/body.md"

      # the organization doesn't let Actions open pull requests, so the
      # leaderboard goes to a branch and an issue links the request to open
      - name: Push a changed leaderboard
        id: push
        run: |
          git add ark/docs/lib/bench/leaderboard.json ark/repo/bench/external/results/newest
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "bench: rerun the size suites at each rival's newest release"
          git push -f origin HEAD:refs/heads/bench/leaderboard
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update its issue
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "bench: rerun the size suites at each rival's newest release"
        run: |
          {
            echo "[Open the pull request from \`bench/leaderboard\`](https://github.com/$GITHUB_REPOSITORY/compare/main...bench/leaderboard?expand=1)."
            echo
            cat "$RUNNER_TEMP/body.md"
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Fail on an unbacked claim
        if: steps.claims.outcome == 'failure'
        run: |
          cat "$RUNNER_TEMP/after.md"
          echo "::error::A claim on the site isn't backed by the new standings"
          exit 1
