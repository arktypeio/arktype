name: publish

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# each job grants only what it needs: the docs build runs the largest
# dependency tree, so it must not hold a write token or an OIDC token
permissions: {}

jobs:
  # a prerelease (an arktype version like X.Y.Z-beta.0) publishes under next,
  # and its docs are served at arktype.io/<major> beside the stable docs, which
  # stay at the root, so they don't replace them before it's stable
  version:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      basePath: ${{ steps.version.outputs.basePath }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for a prerelease
        id: version
        run: |
          echo "prerelease=$(node -p 'require("./ark/type/package.json").version.includes("-")')" >> "$GITHUB_OUTPUT"
          echo "basePath=$(node -p 'const v = require("./ark/type/package.json").version; v.includes("-") ? `/${v.split(".")[0]}` : ""')" >> "$GITHUB_OUTPUT"

  update-gh-pages:
    needs: version
    runs-on: ubuntu-latest
    # a prerelease builds the docs twice: its own and the latest stable's
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup repo
        uses: ./.github/actions/setup

      # twoslash results (see ark/docs/lib/content/twoslash.ts), keyed by what
      # every result depends on, so a change there starts a fresh cache
      - name: Cache docs twoslash results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ark/docs/node_modules/.cache/ark-docs
          key: docs-twoslash-${{ hashFiles('ark/*/out/**/*.d.ts', 'ark/docs/lib/shiki.ts', 'ark/docs/package.json') }}

      # under a prerelease's base path, e.g. /3 (see ark/docs/lib/basePath.ts)
      - name: Build docs
        run: pnpm buildDocs
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_vKr7tmA1TyRlKm9zm5TWVmrTWAybJ2fCk66FtZG49Om
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_BASE_PATH: ${{ needs.version.outputs.basePath }}

      # Pages serves one artifact, so a prerelease's deploy also rebuilds the
      # root from the latest stable arktype's tag, as that release built it
      - name: Build the stable docs
        if: needs.version.outputs.prerelease == 'true'
        run: |
          tag=$(git tag --list 'arktype@*' --sort=-version:refname | grep -v -- - | head -n 1)
          echo "serving the docs of $tag at the root and this commit's at $BASE_PATH"
          git worktree add "$RUNNER_TEMP/stable" "$tag"
          cd "$RUNNER_TEMP/stable"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm install --frozen-lockfile
          pnpm buildDocs
          mv "$GITHUB_WORKSPACE/ark/docs/out" "ark/docs/out${BASE_PATH}"
          mv ark/docs/out "$GITHUB_WORKSPACE/ark/docs/out"
        env:
          BASE_PATH: ${{ needs.version.outputs.basePath }}
          NEXT_PUBLIC_POSTHOG_KEY: phc_vKr7tmA1TyRlKm9zm5TWVmrTWAybJ2fCk66FtZG49Om
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./ark/docs/out

  deploy:
    needs: update-gh-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm trusted publishing: auth comes from the GitHub OIDC token, so no
    # NPM_TOKEN secret is needed. contents: write covers tag pushes and releases.
    permissions:
      contents: write
      id-token: write
    # the npm environment only deploys from main, and each package's trusted
    # publisher requires it. without it, any branch that edits this file to
    # run on its own push could mint an OIDC token and publish.
    environment: npm
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup

      # pnpm 10 publish delegates to npm, which needs >=11.5.1 for OIDC.
      # pnpm 11+ publishes natively, so re-verify OIDC when bumping pnpm.
      - name: Update npm
        run: npm install -g npm@11.21.1

      - name: Create and publish versions
        run: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
