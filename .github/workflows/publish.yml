name: publish

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions: write-all

jobs:
  update-gh-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Build docs
        run: pnpm buildDocs
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_vKr7tmA1TyRlKm9zm5TWVmrTWAybJ2fCk66FtZG49Om
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          ORAMA_PRIVATE_API_KEY: ${{ secrets.ORAMA_PRIVATE_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ark/docs/out

  deploy:
    needs: update-gh-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm trusted publishing: auth comes from the GitHub OIDC token, so no
    # NPM_TOKEN secret is needed. contents: write covers tag pushes and releases.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup

      # pnpm 10 publish delegates to npm, which needs >=11.5.1 for OIDC.
      # pnpm 11+ publishes natively, so re-verify OIDC when bumping pnpm.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Create and publish versions
        run: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
