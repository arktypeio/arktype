name: publish

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# each job grants only what it needs: the docs build runs the largest
# dependency tree, so it must not hold a write token or an OIDC token
permissions: {}

jobs:
  # a prerelease (an arktype version like X.Y.Z-rc.1) publishes under next and
  # leaves the site as it is, so its docs don't go live before it's stable
  version:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for a prerelease
        id: version
        run: echo "prerelease=$(node -p 'require("./ark/type/package.json").version.includes("-")')" >> "$GITHUB_OUTPUT"

  update-gh-pages:
    needs: version
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup repo
        uses: ./.github/actions/setup

      # twoslash results (see ark/docs/lib/content/twoslash.ts), keyed by what
      # every result depends on, so a change there starts a fresh cache
      - name: Cache docs twoslash results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ark/docs/node_modules/.cache/ark-docs
          key: docs-twoslash-${{ hashFiles('ark/*/out/**/*.d.ts', 'ark/docs/lib/shiki.ts', 'ark/docs/package.json') }}

      - name: Build docs
        run: pnpm buildDocs
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_vKr7tmA1TyRlKm9zm5TWVmrTWAybJ2fCk66FtZG49Om
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./ark/docs/out

  deploy:
    needs: update-gh-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm trusted publishing: auth comes from the GitHub OIDC token, so no
    # NPM_TOKEN secret is needed. contents: write covers tag pushes and releases.
    permissions:
      contents: write
      id-token: write
    # the npm environment only deploys from main, and each package's trusted
    # publisher requires it. without it, any branch that edits this file to
    # run on its own push could mint an OIDC token and publish.
    environment: npm
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup repo
        uses: ./.github/actions/setup

      # pnpm 10 publish delegates to npm, which needs >=11.5.1 for OIDC.
      # pnpm 11+ publishes natively, so re-verify OIDC when bumping pnpm.
      - name: Update npm
        run: npm install -g npm@11.21.1

      - name: Create and publish versions
        run: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
