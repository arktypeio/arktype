name: aot

# @ark/aot's suites, which take an hour or more on runners, so they run on
# demand rather than on every PR. prChecks stays a few minutes; this workflow
# holds them until they have a system of their own.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Test @ark/aot
        run: pnpm testAot

  differential:
    runs-on: ubuntu-latest
    # the full-text errors tiers compare every call in each layout, about an
    # hour on a runner
    timeout-minutes: 120
    strategy:
      matrix:
        # the build's options: mutatesInput with each errors mode, size builds,
        # and errors written for size apart from validators
        options:
          - "{}"
          - '{"mutatesInput": true, "errors": "first"}'
          - '{"mutatesInput": true, "errors": "none"}'
          - '{"mutatesInput": "always", "errors": "first"}'
          - '{"mutatesInput": "always", "errors": "none", "jsonInput": true}'
          - '{"optimize": "size"}'
          - '{"optimize": "size", "errors": "first"}'
          - '{"optimizeErrors": "size"}'
          - '{"optimize": "size", "optimizeErrors": "speed"}'
          - '{"optimizeErrors": "size", "errors": "none"}'
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Compare the suites' roots with their precompiled validators
        run: pnpm testDifferential
        env:
          ARK_PRECOMPILE_OPTIONS: ${{ matrix.options }}

  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Run the suites on units precompiled for other roots
        run: pnpm testCache

  perturbation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        # the default build and size builds, which write checkers, sampled on
        # data the suites never pass them
        options:
          - "{}"
          - '{"optimize": "size"}'
          - '{"preset": "smallest"}'
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Change what precompiled sites read
        run: pnpm testPerturbation
        env:
          ARK_PRECOMPILE_OPTIONS: ${{ matrix.options }}

      - name: Run generated programs through the build
        run: pnpm testPrograms
        env:
          ARK_PRECOMPILE_OPTIONS: ${{ matrix.options }}
          ARK_PRECOMPILE_PROGRAMS: 300

  environments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      # the runner's Chrome is used as installed
      - name: Setup Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1

      - name: Run a precompiled program across environments
        run: pnpm testEnvironments
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
