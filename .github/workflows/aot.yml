name: aot

# @ark/aot's derived suites: the repo's tests run against precompiled
# validators (differential, cache), and builds of sampled and generated
# programs (perturbation). They take up to an hour per job on a runner, so
# they aren't part of pr.yml's prChecks gate, which runs @ark/aot's own tests.
#
# - nightly, on each branch in the plan job's list. A failure opens the issue
#   "aot nightly failing", or comments on it, and a green night closes it.
# - on a PR labelled aot:full, when the label is added and on each push after
# - on demand (workflow_dispatch), and from another workflow (workflow_call),
#   which a release could wait on. The caller has to grant issues: write
#   beside contents: read, as GitHub checks a called workflow's permissions
#   whether or not the job asking for them runs.
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "23 8 * * *"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# a push to a labelled PR replaces the run for the push before it. An event
# that doesn't run the suites, like another label, gets a group of its own so
# that it can't cancel one that does
concurrency:
  group: aot-${{ github.event_name == 'pull_request' && (github.event.action == 'synchronize' || github.event.label.name == 'aot:full') && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # whether this event runs the suites, and on which refs
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      refs: ${{ steps.plan.outputs.refs }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          LABELLED_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'aot:full') }}
          # A schedule only starts from the default branch's copy of this
          # file, so the nightly checks out each branch it covers. 3.0 lives
          # on featherduster until it merges to main: delete that entry then.
          NIGHTLY_REFS: main featherduster
          # a ref without this file doesn't have the suites, and is skipped
          SUITE: ark/aot/__tests__/testDifferential.ts
        run: |
          set -euo pipefail

          run=true
          # "" checks out what the event names
          refs='[""]'

          case "$EVENT" in
            pull_request)
              if [[ "$ACTION" == labeled ]]; then
                [[ "$ADDED_LABEL" == "aot:full" ]] || run=false
              else
                [[ "$LABELLED_FULL" == true ]] || run=false
              fi
              ;;
            schedule)
              # forks inherit the schedule, but not the reason for it
              if [[ "$GITHUB_REPOSITORY" != arktypeio/arktype ]]; then
                run=false
              else
                found=()
                for ref in $NIGHTLY_REFS; do
                  if out=$(gh api "repos/$GITHUB_REPOSITORY/contents/$SUITE?ref=$ref" --silent 2>&1); then
                    found+=("$ref")
                  elif grep -q "HTTP 404" <<<"$out"; then
                    echo "::notice::Skipping $ref, which has no $SUITE"
                  else
                    echo "$out" >&2
                    exit 1
                  fi
                done
                if (( ${#found[@]} )); then
                  refs=$(jq -cn '$ARGS.positional' --args "${found[@]}")
                else
                  run=false
                fi
              fi
              ;;
          esac

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "refs=$refs" >> "$GITHUB_OUTPUT"

  differential:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # the full-text errors tiers compare every call in each layout, about an
    # hour on a runner
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
        # the build's options: mutatesInput with each errors mode, size builds,
        # and errors written for size apart from validators
        options:
          - "{}"
          - '{"mutatesInput": true, "errors": "first"}'
          - '{"mutatesInput": true, "errors": "none"}'
          - '{"mutatesInput": "always", "errors": "first"}'
          - '{"mutatesInput": "always", "errors": "none", "jsonInput": true}'
          - '{"optimize": "size"}'
          - '{"optimize": "size", "errors": "first"}'
          - '{"optimizeErrors": "size"}'
          - '{"optimize": "size", "optimizeErrors": "speed"}'
          - '{"optimizeErrors": "size", "errors": "none"}'
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.ref }}

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Compare the suites' roots with their precompiled validators
        run: pnpm testDifferential
        env:
          ARK_PRECOMPILE_OPTIONS: ${{ matrix.options }}

  cache:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.ref }}

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Run the suites on units precompiled for other roots
        run: pnpm testCache

  perturbation:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
        # the default build and size builds, which write checkers, sampled on
        # data the suites never pass them
        options:
          - "{}"
          - '{"optimize": "size"}'
          - '{"preset": "smallest"}'
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.ref }}

      - name: Setup repo
        uses: ./.github/actions/setup

      - name: Change what precompiled sites read
        run: pnpm testPerturbation
        env:
          ARK_PRECOMPILE_OPTIONS: ${{ matrix.options }}

      - name: Run generated programs through the build
        run: pnpm testPrograms
        env:
          ARK_PRECOMPILE_OPTIONS: ${{ matrix.options }}
          ARK_PRECOMPILE_PROGRAMS: 300

  # the nightly's result, kept in one issue
  alert:
    needs: [plan, differential, cache, perturbation]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: aot nightly failing
          LABEL: aot-nightly
        run: |
          set -euo pipefail

          # jobs that didn't pass, including one cancelled or timed out
          failed=$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")' <<<"$NEEDS")
          ran=$(jq -r '.plan.outputs.run // "false"' <<<"$NEEDS")

          if [[ -z "$failed" && "$ran" != true ]]; then
            echo "The suites didn't run, so there is nothing to report."
            exit 0
          fi

          # the open issue's number, or nothing
          issue=$(
            gh issue list --label "$LABEL" --state open --limit 100 --json number,title |
              jq -r --arg title "$TITLE" '[.[] | select(.title == $title)][0].number // empty'
          )

          if [[ -n "$failed" ]]; then
            body="The [nightly run]($RUN_URL) of \`aot.yml\` failed in: $failed."
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "$body"
            else
              # an issue can't be opened with a label the repo doesn't have
              gh label create "$LABEL" --description "Tracks aot.yml's nightly run" --color B60205 --force
              gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
            fi
          elif [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "The [nightly run]($RUN_URL) passed."
          else
            echo "The nightly passed and no issue is open."
          fi
