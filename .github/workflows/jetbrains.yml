name: jetbrains

# The JetBrains plugin (ark/jetbrains) runs the VS Code extension's grammar and
# ErrorLens rules and is checked against ark/editor-conformance, which builds
# on ark/tree-sitter, so a change to any of them runs its tests. They need a
# JDK and, for the IDE tests and compatibility check, IDE downloads that Gradle
# caches between runs.
on:
  pull_request:
    branches: [main]
    paths:
      - "ark/jetbrains/**"
      - "ark/extension/**"
      - "ark/editor-conformance/**"
      - "ark/tree-sitter/**"
      - ".github/workflows/jetbrains.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetbrains-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: ark/jetbrains

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Gradle writes the grammars from node_modules, so only an install is
      # needed, not the repo build ./.github/actions/setup does
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # the TextMate port and ErrorLens rewriting against ark/editor-conformance
      - name: Test core
        run: ./gradlew :core:test

      - name: Test the IDE integration
        run: ./gradlew :plugin:test

      - name: Verify IDE compatibility
        run: ./gradlew :plugin:verifyPlugin
