packages:
  - "ark/*"

# skip versions published in the last day (in minutes), so a hijacked release
# is usually caught and pulled before it can resolve into the lockfile
minimumReleaseAge: 1440

# lets tools that need TypeScript's JS API, which TS 7 doesn't have, use TS 6
pnpmfile: pnpmfile.ts

catalog:
  typescript: 7.1.0-beta

catalogs:
  # for packages that need TypeScript's JS API (keep in sync with pnpmfile.ts
  # and the typescript-6 alias in ark/attest/package.json)
  ts6:
    typescript: 6.0.3
